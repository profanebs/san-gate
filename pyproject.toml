[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sangate2"
version = "0.1.0"
description = "Layer-aware compliance-canary gate for requirement documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "lxml>=5.0",
]

[project.scripts]
sangate = "sangate.cli:main"
sangate2 = "sangate2.cli:main"

[tool.setuptools.packages.find]
include = ["sangate*", "sangate1*", "sangate2*"]

[tool.setuptools.package-data]
sangate1 = ["data/*.json", "tests/fixtures/*", "tests/fixtures/**/*"]
sangate2 = ["data/*.json"]
